  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Georgia', serif; max-width: 800px; margin: 0 auto; padding: 0; color: #1a1a1a; background: #f4f7f4; }
    header { background: #1a3d2b; color: white; padding: 2rem; border-bottom: 4px solid #4a9e6b; }
    header h1 { font-size: 2.2rem; margin: 0 0 0.25rem; }
    p.tagline { color: #a8d5b5; margin: 0; font-style: italic; }

    input[type=range] { width: 100%; accent-color: #4a9e6b; }
    .radio-group { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
    .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 1rem; }
    .result-card { background: #f4f7f4; border-radius: 8px; padding: 0.75rem 1rem; }
    .result-card p { margin: 0; }
    .result-card .label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .result-card .value { font-size: 16px; font-weight: bold; color: #1a3d2b; }
    a.back { display: inline-block; margin-bottom: 1rem; color: #4a9e6b; text-decoration: none; font-size: 14px; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
